[package]
name = "cubecl-msl4"
version = "0.7.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "CubeCL MSL 4.0 compiler backend (IR -> MSL)"
repository = "https://github.com/tracel-ai/cubecl"

[lib]
name = "cubecl_msl4"
path = "src/lib.rs"

[dependencies]
cubecl-core = { path = "../cubecl-core", version = "0.7.0" }
cubecl-common = { path = "../cubecl-common", version = "0.7.0" }
cubecl-ir = { path = "../cubecl-ir", version = "0.7.0" }

